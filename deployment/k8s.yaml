apiVersion: v1
kind: Secret
metadata:
  name: travel-expense-secrets
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-expense-config
data:
  LLM_MODE: "mock"
  LLM_BASE_URL: ""
  LLM_MODEL: ""
  MAX_AGENT_STEPS: "10"
  DATABASE_PATH: "/app/data/app.db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-expense-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: travel-expense-api}
  template:
    metadata:
      labels: {app: travel-expense-api}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: api
        image: YOUR_REGISTRY/ai-travel-expense:1.0
        command: ["uvicorn","backend.main:app","--host","0.0.0.0","--port","8000"]
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: travel-expense-config}}]
        env:
        - name: LLM_API_KEY
          valueFrom: {secretKeyRef: {name: travel-expense-secrets,key: LLM_API_KEY}}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 20
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: travel-expense-api}
  ports: [{port: 8000,targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-expense-ui
spec:
  replicas: 1
  selector:
    matchLabels: {app: travel-expense-ui}
  template:
    metadata:
      labels: {app: travel-expense-ui}
    spec:
      containers:
      - name: ui
        image: YOUR_REGISTRY/ai-travel-expense-ui:1.0
        ports: [{containerPort: 8501}]
---
apiVersion: v1
kind: Service
metadata:
  name: travel-expense-ui
spec:
  selector: {app: travel-expense-ui}
  ports: [{port: 8501,targetPort: 8501}]
