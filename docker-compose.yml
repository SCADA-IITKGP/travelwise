services:
  api:
    build: {context: ., dockerfile: deployment/Dockerfile.backend}
    environment:
      APP_ENV: ${APP_ENV:-development}
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://103.42.50.41:1034/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-8B}
      LLM_CA_CERT_FILE: ${LLM_CA_CERT_FILE:-./certs/vm04-ca.crt}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      QWEN_CA_CERT: ${QWEN_CA_CERT:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-hybrid}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://103.42.50.41:1035/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-small-en-v1.5}
      EMBEDDING_CA_CERT_FILE: ${EMBEDDING_CA_CERT_FILE:-}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-512}
      TEAM_TOKEN_QUOTA: ${TEAM_TOKEN_QUOTA:-100000}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-10}
      DATABASE_PATH: /app/data/app.db
      POLICY_DIR: /app/data/policies
    volumes:
      - appdata:/app/data
      - ./data/policies:/app/data/policies:ro
      - ./data/corpus_metadata:/app/data/corpus_metadata:ro
      - ./certs:/app/certs:ro
      - ./evaluation/results:/app/evaluation/results
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
  ui:
    build: {context: ., dockerfile: deployment/Dockerfile.frontend}
    depends_on:
      api: {condition: service_healthy}
    ports: ["${UI_PORT:-8501}:8501"]
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:8501/"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  appdata:
